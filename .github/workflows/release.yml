name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Asset names carry the Rust target instead of the tag, so scripts/npm-pack.sh
# can build the same URL for every release and verify a .sha256 sidecar.
#
# Linux ships both flavors: glibc builds (glibc floor = whatever the runner
# ships — 22.04 for x86_64, 2.35, covering Debian 12 / Ubuntu 22.04+; 24.04
# for arm64, 2.39, no older arm64 runner) and static musl builds for
# Alpine/BusyBox systems. The musl targets link with rust-lld and bundled
# musl libc, so no musl cross-toolchain is installed anywhere.
jobs:
  build-linux-x86_64:
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Smoke test
        run: target/x86_64-unknown-linux-gnu/release/envp --version
      - name: Package
        run: |
          asset=envpouch-x86_64-unknown-linux-gnu
          tar -C target/x86_64-unknown-linux-gnu/release -czf "$asset.tar.gz" envp
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            envpouch-x86_64-unknown-linux-gnu.tar.gz
            envpouch-x86_64-unknown-linux-gnu.tar.gz.sha256

  build-linux-aarch64:
    name: build aarch64-unknown-linux-gnu
    # GitHub-provided arm64 runner: native build, no cross-compilation needed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Smoke test
        run: target/aarch64-unknown-linux-gnu/release/envp --version
      - name: Package
        run: |
          asset=envpouch-aarch64-unknown-linux-gnu
          tar -C target/aarch64-unknown-linux-gnu/release -czf "$asset.tar.gz" envp
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            envpouch-aarch64-unknown-linux-gnu.tar.gz
            envpouch-aarch64-unknown-linux-gnu.tar.gz.sha256

  build-linux-musl-x86_64:
    name: build x86_64-unknown-linux-musl
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke test
        run: |
          file target/x86_64-unknown-linux-musl/release/envp | grep -qE 'static-pie linked|statically linked'
          target/x86_64-unknown-linux-musl/release/envp --version
      - name: Package
        run: |
          asset=envpouch-x86_64-unknown-linux-musl
          tar -C target/x86_64-unknown-linux-musl/release -czf "$asset.tar.gz" envp
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-x86_64
          path: |
            envpouch-x86_64-unknown-linux-musl.tar.gz
            envpouch-x86_64-unknown-linux-musl.tar.gz.sha256

  build-linux-musl-aarch64:
    name: build aarch64-unknown-linux-musl
    # GitHub-provided arm64 runner: native build, no cross-compilation needed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Smoke test
        run: target/aarch64-unknown-linux-musl/release/envp --version
      - name: Package
        run: |
          asset=envpouch-aarch64-unknown-linux-musl
          tar -C target/aarch64-unknown-linux-musl/release -czf "$asset.tar.gz" envp
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-aarch64
          path: |
            envpouch-aarch64-unknown-linux-musl.tar.gz
            envpouch-aarch64-unknown-linux-musl.tar.gz.sha256

  build-macos:
    name: build universal2-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Merge into universal2 binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/envp \
            target/x86_64-apple-darwin/release/envp \
            -output envp
          chmod +x envp
          file envp
          ./envp --version
      - name: Package
        run: |
          asset=envpouch-universal2-apple-darwin
          tar -czf "$asset.tar.gz" envp
          shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: |
            envpouch-universal2-apple-darwin.tar.gz
            envpouch-universal2-apple-darwin.tar.gz.sha256

  build-windows-x86_64:
    name: build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: target/release/envp.exe --version
      - name: Package
        shell: pwsh
        run: |
          $asset = "envpouch-x86_64-pc-windows-msvc"
          Compress-Archive -Path target/release/envp.exe -DestinationPath "$asset.zip"
          $hash = (Get-FileHash "$asset.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset.zip" | Out-File -Encoding ascii "$asset.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            envpouch-x86_64-pc-windows-msvc.zip
            envpouch-x86_64-pc-windows-msvc.zip.sha256

  release:
    needs:
      [
        build-linux-x86_64,
        build-linux-aarch64,
        build-linux-musl-x86_64,
        build-linux-musl-aarch64,
        build-macos,
        build-windows-x86_64,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum envpouch-*.tar.gz envpouch-*.zip > sha256sums.txt
          cat sha256sums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            envpouch-*.tar.gz
            envpouch-*.tar.gz.sha256
            envpouch-*.zip
            envpouch-*.zip.sha256
            sha256sums.txt

  # Publishes the same binaries to npm as one self-contained package: every
  # platform lives in vendor/ inside `envpouch`, so installing needs only the
  # npm registry (mirror-friendly) and runs no install scripts. Version numbers
  # come from Cargo.toml, so tagging is the only release action.
  #
  # Gated on the NPM_PUBLISH repository variable: npm requires a trusted
  # publisher to be configured per package on npmjs.com, which can only happen
  # after the first manual publish. Until NPM_PUBLISH=true is set, tag releases
  # skip this job instead of failing red. Setup steps: npm/README.md.
  npm:
    name: publish npm
    needs:
      [
        build-linux-x86_64,
        build-linux-aarch64,
        build-linux-musl-x86_64,
        build-linux-musl-aarch64,
        build-macos,
        build-windows-x86_64,
      ]
    if: startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: npm-artifacts
          merge-multiple: true
      - name: stage package
        run: bash scripts/npm-pack.sh --from-artifacts npm-artifacts
      - name: publish
        run: bash scripts/npm-publish.sh
