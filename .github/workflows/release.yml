name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static)
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Smoke test
        run: target/x86_64-unknown-linux-musl/release/envrun --version
      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/envrun envrun
          chmod +x envrun
          tar -czf "envrun-${GITHUB_REF_NAME}-x86_64-linux-musl.tar.gz" envrun
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: envrun-*.tar.gz

  build-linux-aarch64:
    # GitHub-provided arm64 runner: native build, no cross-compilation needed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static)
        run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Smoke test
        run: target/aarch64-unknown-linux-musl/release/envrun --version
      - name: Package
        run: |
          cp target/aarch64-unknown-linux-musl/release/envrun envrun
          chmod +x envrun
          tar -czf "envrun-${GITHUB_REF_NAME}-aarch64-linux-musl.tar.gz" envrun
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: envrun-*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Merge into universal2 binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/envrun \
            target/x86_64-apple-darwin/release/envrun \
            -output envrun
          chmod +x envrun
          file envrun
          ./envrun --version
      - name: Package
        run: tar -czf "envrun-${GITHUB_REF_NAME}-universal2-macos.tar.gz" envrun
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: envrun-*.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Smoke test
        run: target/release/envrun.exe --version
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/envrun.exe `
            -DestinationPath "envrun-$($env:GITHUB_REF_NAME)-x86_64-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: envrun-*.zip

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos, build-windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum envrun-*.tar.gz envrun-*.zip > sha256sums.txt
          cat sha256sums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            envrun-*.tar.gz
            envrun-*.zip
            sha256sums.txt
