[package]
name = "envpouch"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Encrypted environment variable profile manager (import/export/run with password) — command `envp`"
exclude = [".github", "scripts", "npm"]
license = "MIT"
repository = "https://github.com/wusende/envpouch"
homepage = "https://github.com/wusende/envpouch"
readme = "README.md"
keywords = ["env", "dotenv", "secrets", "encryption", "cli"]
categories = ["command-line-utilities", "config", "cryptography"]

# The project/package is `envpouch`; the command users type is `envp`.
[[bin]]
name = "envp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7"
zeroize = "1"
dirs = "6"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
chrono = "0.4"
libc = "0.2"
clap_complete = "4"
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = true
strip = true
