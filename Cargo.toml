[package]
name = "envrun"
version = "0.1.0"
edition = "2024"
description = "Encrypted environment variable profile manager (import/export/run with password)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7"
zeroize = "1"
dirs = "6"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
chrono = "0.4"
libc = "0.2"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
clap_complete = "4"
tempfile = "3"

[dev-dependencies]

[profile.release]
lto = true
strip = true
